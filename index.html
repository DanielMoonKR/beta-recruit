body{margin:0;background:#FFF9F6;-webkit-text-size-adjust:100%}

.m-cta{display:none}

.float-l,.float-r{position:fixed;z-index:34;bottom:calc(24px + env(safe-area-inset-bottom, 0px))}

.acc summary:hover{border-color:#CFC5C0}.acc summary:focus-visible{outline:2px solid #FF4802;outline-offset:2px}
.faq summary{list-style:none;cursor:pointer}.faq summary::-webkit-details-marker{display:none}

<body>
<div id="app"></div>
<template id="dc-template">

<div style="font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #2B2523; background: #FFF9F6; word-break: keep-all; overflow-x: clip">

<sc-if value="{{isPage}}" hint-placeholder-val="{{ true }}">
<header style="background: #1A1513; color: #FFFFFF">
<div style="max-width: 1120px; margin: 0 auto; padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px">
<div style="display: flex; align-items: center; gap: 2px; margin-left: -10px">
<a href="https://m.thankqcamping.com/" aria-label="뒤로가기 (땡큐캠핑 홈)" style="width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<a href="https://m.thankqcamping.com/" aria-label="땡큐캠핑 홈으로 이동" style="display: inline-flex; align-items: center; min-height: 44px"><img src="assets/logo-white.png" alt="땡큐캠핑 THANKQ CAMPING" style="height: clamp(32px, 8vw, 40px); width: auto; display: block"></a>
</div>
<div class="nav-cta" style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{share}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #4A403C; border-radius: 10px; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg><span>친구에게 공유하기</span></button>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><a href="{{apply.href}}" target="_blank" rel="noopener" style="color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 4px">신청하기 →</a></sc-if><sc-if value="{{closed}}" hint-placeholder-val="{{ false }}"><span aria-disabled="true" style="color: #9C928D; font-size: 15px; font-weight: 600; padding: 12px 4px; cursor: not-allowed">신청 마감</span></sc-if>
</div>
</div>

<div style="max-width: 1120px; margin: 0 auto; padding: clamp(48px, 9vw, 96px) 20px 0; display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 4vw, 28px); text-align: center">
<span style="display: inline-block; padding: 8px 16px; background: rgba(255, 255, 255, 0.06); border: 1px solid #4A403C; border-radius: 999px; font-size: 14px; font-weight: 800; letter-spacing: 0.08em"><span class="grad-text-light">BETA TESTER 모집</span></span>
<h1 style="margin: 0; font-size: clamp(2.4rem, 8.4vw, 5rem); line-height: 1.15; font-weight: 800; letter-spacing: -0.04em">새로워진 땡큐캠핑,<br><span class="grad-text-light">가장 먼저</span> 써보세요</h1>
<p style="margin: 0; max-width: 600px; font-size: clamp(16px, 4.2vw, 19px); line-height: 1.7; color: #D9D1CC">정식 오픈 전, 리뉴얼 앱의 핵심 기능을 먼저 써보세요.<br>여러분의 의견이 더 나은 땡큐캠핑을 만듭니다.</p>
<div class="hero-ctas" style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; width: 100%">
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><a href="{{apply.href}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; background: #FF4802; color: #FFFFFF; font-weight: 700; font-size: 19px; border-radius: 12px; text-decoration: none; box-sizing: border-box">베타 테스터 신청하기</a></sc-if><sc-if value="{{closed}}" hint-placeholder-val="{{ false }}"><span aria-disabled="true" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; background: #EDE5E1; color: #7A706B; font-weight: 700; font-size: 19px; border-radius: 12px; text-decoration: none; box-sizing: border-box; cursor: not-allowed">신청 마감</span></sc-if>
<a href="#about" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px; color: #FFFFFF; background: transparent; font-weight: 600; font-size: 16px; border-radius: 12px; border: 1px solid #5A524E; text-decoration: none; box-sizing: border-box">자세히 보기</a>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><p class="hero-period" style="margin: 0; font-size: 15px; line-height: 1.6; color: #B9B0AB">모집 기간 ~ 11.19(목) 23:30 · 선정 인원 1,000명</p></sc-if><sc-if value="{{closed}}" hint-placeholder-val="{{ false }}"><p class="hero-period" style="margin: 0; font-size: 15px; line-height: 1.6; color: #B9B0AB">베타 테스터 신청이 마감되었습니다. 관심 가져주셔서 감사합니다.</p></sc-if>
</div>

<div role="region" aria-roledescription="carousel" aria-label="리뉴얼 앱 화면 미리보기" style="margin-top: clamp(40px, 7vw, 64px)">
<div onMouseEnter="{{hero.hoverOn}}" onMouseLeave="{{hero.hoverOff}}" onPointerDown="{{hero.down}}" onPointerMove="{{hero.move}}" onPointerUp="{{hero.up}}" onPointerCancel="{{hero.up}}" onClickCapture="{{hero.clickCap}}" style="position: relative; overflow: hidden; padding: 8px 0 4px; touch-action: pan-y; -webkit-user-select: none; user-select: none; cursor: {{hero.cursor}}">
<div style="position: relative; left: 50%; display: flex; gap: 28px; align-items: flex-start; transform: translateX({{hero.trackX}}); transition: {{hero.transition}}">
<sc-for list="{{hero.slides}}" as="sl" hint-placeholder-count="6">
<div role="group" aria-roledescription="slide" aria-label="{{sl.aria}}" aria-hidden="{{sl.hidden}}" onClick="{{sl.go}}" style="flex: 0 0 260px; display: flex; flex-direction: column; align-items: center; gap: 20px; cursor: {{sl.cursor}}; opacity: {{sl.opacity}}; transform: scale({{sl.scale}}); transform-origin: top center; transition: opacity 0.5s ease, transform 0.5s ease">
<div style="width: 260px; aspect-ratio: 1179 / 2379; box-sizing: border-box; border: 3px solid #F4F1EF; border-radius: 36px; background: #F4F1EF; box-shadow: {{sl.shadow}}; overflow: hidden">
<sc-if value="{{sl.hasVideo}}" hint-placeholder-val="{{ false }}">
<video data-hero-video="1" src="{{sl.video}}" poster="{{sl.poster}}" autoPlay="{{sl.autoPlay}}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="metadata" aria-label="{{sl.title}} 화면 영상" style="width: 100%; height: 100%; object-fit: cover; border-radius: 33px; display: block; background: #F3EEEB"></video>
</sc-if>
<sc-if value="{{sl.hasSprite}}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{sl.title}} 화면" style="width: 100%; height: 100%; border-radius: 33px; background-color: #F3EEEB; background-image: url(assets/hero-mockups.webp); background-repeat: no-repeat; background-size: 500% 500%; background-position: {{sl.spritePos}}"></div>
</sc-if>
<sc-if value="{{sl.hasImage}}" hint-placeholder-val="{{ false }}">
<img src="{{sl.image}}" alt="{{sl.title}} 화면" style="width: 100%; height: 100%; object-fit: cover; border-radius: 33px; display: block">
</sc-if>
<sc-if value="{{sl.noImage}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; height: 100%; border-radius: 33px; background: #F3EEEB; box-sizing: border-box; padding: 16% 7% 7%; display: flex; flex-direction: column; gap: 10px; position: relative">
<div style="height: 8%; border-radius: 10px; background: #FFFFFF"></div>
<div style="height: 22%; border-radius: 14px; background: #E5DAD4"></div>
<div style="flex: 1; border-radius: 14px; background: #FFFFFF"></div>
<div style="flex: 1; border-radius: 14px; background: #FFFFFF"></div>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<img src="assets/logo-symbol.png" alt="" style="width: 40px; height: 40px; display: block">
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700; color: #2B2523">목업 이미지 {{sl.no}}</span>
</div>
</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; text-align: center; max-width: 260px">
<strong style="font-size: 18px; font-weight: 700; line-height: 1.4; color: #FFFFFF">{{sl.title}}</strong>
<span style="font-size: 15px; line-height: 1.55; color: #B9B0AB">{{sl.sub}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; justify-content: center; padding: clamp(28px, 5vw, 40px) 20px 0">
<button type="button" onClick="{{gallery.open}}" aria-haspopup="dialog" style="display: inline-flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 22px 8px 10px; border: 1px solid #4A403C; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: #FFFFFF; cursor: pointer; text-align: left; max-width: 100%">
<span aria-hidden="true" style="display: flex; flex-shrink: 0">
<sc-for list="{{gallery.peek}}" as="pk" hint-placeholder-count="3">
<span style="width: 30px; height: 41px; margin-left: {{pk.ml}}; border-radius: 7px; border: 2px solid #1A1513; box-sizing: border-box; background-image: url(assets/hero-mockups.webp); background-repeat: no-repeat; background-size: 500% 500%; background-position: {{pk.pos}}; transform: rotate({{pk.rot}}); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35); filter: blur(1.5px) brightness(0.85)"></span>
</sc-for>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<strong style="font-size: 16px; font-weight: 700; line-height: 1.35">아직 <span class="grad-text-light">공개되지 않은</span> 페이지</strong>
<span style="font-size: 13px; color: #B9B0AB; line-height: 1.4">{{gallery.teaser}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 6 6 6-6 6"></path></svg>
</button>

<div style="max-width: 1120px; margin: 0 auto; padding: clamp(48px, 8vw, 80px) 20px clamp(56px, 9vw, 88px)">
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px">
<div style="background: #2B2523; border: 1px solid #3D3532; border-radius: 20px; padding: clamp(22px, 4vw, 32px) 20px; display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; text-align: center">
<dt style="font-size: 15px; font-weight: 600; color: #B9B0AB">베타 테스터 선정</dt>
<dd class="grad-text-light" style="margin: 0; font-size: clamp(2.2rem, 6vw, 3.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">1,000명</dd>
</div>
<div style="background: #2B2523; border: 1px solid #3D3532; border-radius: 20px; padding: clamp(22px, 4vw, 32px) 20px; display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; text-align: center">
<dt style="font-size: 15px; font-weight: 600; color: #B9B0AB">신청 마감 · 23:30</dt>
<dd class="grad-text-light" style="margin: 0; font-size: clamp(2.2rem, 6vw, 3.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">11.19</dd>
</div>
<div style="background: #2B2523; border: 1px solid #3D3532; border-radius: 20px; padding: clamp(22px, 4vw, 32px) 20px; display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; text-align: center">
<dt style="font-size: 15px; font-weight: 600; color: #B9B0AB">쿠폰 및 포인트 참여 혜택</dt>
<dd class="grad-text-light" style="margin: 0; font-size: clamp(2.2rem, 6vw, 3.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1"><span style="font-size: 0.5em; letter-spacing: 0; margin-right: 6px">최대</span>20만원+</dd>
</div>
</dl>
</div>
</header>

<nav aria-label="섹션 바로가기" style="position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255, 249, 246, 0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #F0E6E1">

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<a href="#{{t.id}}" data-tab="{{t.id}}" aria-current="{{t.current}}" onClick="{{t.go}}" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 52px; padding: 0 14px; box-sizing: border-box; border-bottom: 3px solid {{t.line}}; font-size: 15px; font-weight: {{t.weight}}; color: {{t.color}}; text-decoration: none; white-space: nowrap; transition: color 0.2s, border-color 0.2s">{{t.label}}</a>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span class="grad-text-sm" style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em">WHAT'S NEW</span>
<h2 style="margin: 0; font-size: clamp(1.75rem, 5.4vw, 2.75rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.25">이렇게 달라져요</h2>
<p style="margin: 0; max-width: 560px; font-size: clamp(15px, 4vw, 18px); line-height: 1.65; color: #6B625E">베타 테스트에서 먼저 만나볼 주요 변화입니다.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #F0E6E1; border-radius: 20px; padding: clamp(22px, 5vw, 32px); display: flex; flex-direction: column; gap: 12px">

<span style="font-size: 14px; font-weight: 700; color: #6B625E">01</span>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<li style="display: flex; gap: 8px; align-items: flex-start; font-size: 15px; font-weight: 400; line-height: 1.55; color: #6B625E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B0AB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>새 디자인 시스템 전면 적용</span></li>
<li style="display: flex; gap: 8px; align-items: flex-start; font-size: 15px; font-weight: 400; line-height: 1.55; color: #6B625E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B0AB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>한층 편리해진 서비스 이용</span></li>
</ul>
</div>

<p style="margin: 0; padding: 0 18px 18px 52px; font-size: 15px; line-height: 1.7; color: #5A524E">미션 수행 시 숙박 할인 쿠폰과 Q포인트를 드려요. 5대 미션을 완주하면 멤버십 최고 등급을 부여하고, 심층 인터뷰에 참여하면 충전형 20만 원 쿠폰을 드려요. 버그를 제보하면 Q포인트를 드려요(최초 1회). 지급받은 혜택은 정식 오픈 이후에도 사용할 수 있어요.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #F0E6E1; border-radius: 14px">
<summary style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 14px 18px; box-sizing: border-box">
<span style="font-size: 15px; font-weight: 800; color: #C23A00; flex-shrink: 0">Q8.</span>
<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.5">테스트용 앱은 어떻게 설치하나요?</span>
<svg class="faq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A524E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
</summary>
<p style="margin: 0; padding: 0 18px 18px 52px; font-size: 15px; line-height: 1.7; color: #5A524E">테스트용 앱 설치 방법과 링크는 신청 시 입력한 이메일 주소로 보내드려요. 스미싱 예방을 위해 문자에는 테스트 관련 URL 링크를 넣지 않으니, 링크가 담긴 문자는 열지 마세요.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #F0E6E1; border-radius: 14px">
<summary style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 14px 18px; box-sizing: border-box">
<span style="font-size: 15px; font-weight: 800; color: #C23A00; flex-shrink: 0">Q9.</span>
<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.5">베타 기간에도 모든 서비스를 이용할 수 있나요?</span>
<svg class="faq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A524E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
</summary>
<p style="margin: 0; padding: 0 18px 18px 52px; font-size: 15px; line-height: 1.7; color: #5A524E">장박 예약, 양도, 쇼핑 서비스는 베타 기간에 이용할 수 없어요. 장박 예약은 숙소에 직접 전화로 문의할 수 있어요. 숲체험, AI 기반 캠핑장 추천 · 요약, Q페이(퀵계좌이체) · 즉시 할인, 땡큐톡톡, 쇼핑몰 · 커뮤니티 리뉴얼은 정식 오픈 이후 선보일 예정이에요.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #F0E6E1; border-radius: 14px">

<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.5">수집한 개인정보는 어디에 쓰이나요?</span>
<svg class="faq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A524E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
</summary>
<p style="margin: 0; padding: 0 18px 18px 52px; font-size: 15px; line-height: 1.7; color: #5A524E">이름은 땡큐캠핑 가입 회원과 일치하는지 확인해 혜택을 지급하는 데, 휴대폰 번호는 선정 결과와 진행 안내에, 이메일 주소는 앱 설치와 링크 안내에만 사용해요. 혜택이 지급되는 12.15 이후 즉시 파기돼요.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #F0E6E1; border-radius: 14px">

<span style="font-size: 15px; font-weight: 800; color: #C23A00; flex-shrink: 0">Q11.</span>
<span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.5">베타 앱에서 오류가 생기면 어떻게 하나요?</span>
<svg class="faq-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A524E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m6 9 6 6 6-6"></path></svg>
</summary>
<p style="margin: 0; padding: 0 18px 18px 52px; font-size: 15px; line-height: 1.7; color: #5A524E">베타 서비스에는 오류가 있을 수 있어요. 오류는 심각도에 따라 P0(치명)부터 P3(개선)까지 나눠 처리하며, 이중결제·오버부킹처럼 치명적인 오류는 30분 내 착수해 2시간 내 조치해요. 등급별 기준은 베타 서비스 이용약관에서 확인할 수 있어요.</p>

  // 화면 확인용 예시 신청자: 신청 항목 정의의 보기 안에서만 값을 만들어 매핑이 어긋나지 않게 합니다.
  sampleApplicants() {
    let seed = 7;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const pick = (arr, w) => {
      const total = w.reduce((s, x) => s + x, 0);
      let r = rand() * total;
      for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
      return arr[arr.length - 1];
    };
    const defs = this.fieldDefs();
    const byKey = {};
    defs.forEach((f) => { byKey[f.key] = f; });

    const perDay = [6, 4, 3, 3, 2, 4, 7];
    const list = [];
    let n = 0;
    perDay.forEach((cnt, di) => {
      for (let k = 0; k < cnt; k++) {
        n++;
        const device = pick(byKey.device.options, [58, 36, 6]);
        const models = byKey.model.optionsBy[device];
        const member = pick(byKey.member.options, [72, 28]);
        const hh = String(9 + Math.floor(rand() * 13)).padStart(2, '0');
        const mm = String(Math.floor(rand() * 60)).padStart(2, '0');
        list.push({
          id: 's' + n,
          sample: true,
          createdAt: '2026.11.' + String(13 + di).padStart(2, '0') + ' ' + hh + ':' + mm,
          values: {
            name: sur[Math.floor(rand() * sur.length)] + given[Math.floor(rand() * given.length)],
            phone: '010-' + String(1000 + Math.floor(rand() * 9000)) + '-' + String(1000 + Math.floor(rand() * 9000)),
            email: 'tester' + String(n).padStart(3, '0') + '@example.com',
            device: device,
            model: models[Math.floor(rand() * models.length)],
            frequency: pick(byKey.frequency.options, [30, 40, 22, 8]),
            channel: pick(byKey.channel.options, [30, 22, 16, 14, 8, 6, 4]),
            member: member,
            bookings: member === '가입했어요' ? pick(byKey.bookings.options, [18, 34, 28, 12, 8]) : '없음',
            consentPrivacy: true,

  timeSeries(applicants) {
    const counts = {};
    applicants.forEach((a) => { const d = a.createdAt.slice(0, 10); counts[d] = (counts[d] || 0) + 1; });
    const keys = Object.keys(counts).sort();
    if (!keys.length) return { days: [], points: '', dots: [], minWidth: '0px', aria: '신청 데이터가 없어요.' };
    const toDate = (k) => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10));
    const p = (n) => String(n).padStart(2, '0');
    const days = [];
    for (let d = toDate(keys[0]); d <= toDate(keys[keys.length - 1]); d.setDate(d.getDate() + 1)) {
      const k = d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
      days.push({ key: k, label: p(d.getMonth() + 1) + '.' + p(d.getDate()), count: counts[k] || 0 });
    }
    let cum = 0;
    days.forEach((d) => { cum += d.count; d.cum = cum; });
    const maxDay = Math.max.apply(null, days.map((d) => d.count)) || 1;
    const n = days.length;
    const pts = days.map((d, i) => ({ x: ((i + 0.5) / n) * 100, y: 100 - (d.cum / cum) * 92 }));
    return {
      days: days.map((d) => ({ label: d.label, count: d.count + '명', cum: d.cum, barH: Math.max(2, (d.count / maxDay) * 60) + '%' })),
      points: pts.map((q) => q.x.toFixed(2) + ',' + q.y.toFixed(2)).join(' '),
      dots: pts.map((q) => ({ left: q.x.toFixed(2) + '%', top: q.y.toFixed(2) + '%' })),
      minWidth: (n * 56) + 'px',
      aria: '일별 신청자와 누적 신청자 추이. ' + days.map((d) => d.label + ' ' + d.count + '명, 누적 ' + d.cum + '명').join('; ')
    };
  }
  treemap(f, applicants) {
    const palette = [
      { bg: '#2B2523', fg: '#FFFFFF' }, { bg: '#FF4802', fg: '#1F1A18' }, { bg: '#FFCDB8', fg: '#2B2523' },
      { bg: '#E5DAD4', fg: '#2B2523' }, { bg: '#6B625E', fg: '#FFFFFF' }, { bg: '#FFF1EB', fg: '#2B2523' }, { bg: '#B9B0AB', fg: '#1F1A18' }, { bg: '#FF9A6B', fg: '#1F1A18' }
    ];
    const total = applicants.filter((a) => a.values[f.key]).length;
    const items = f.options.map((o) => ({ name: o, count: applicants.filter((a) => a.values[f.key] === o).length }))
      .sort((x, y) => y.count - x.count)
      .map((it, i) => Object.assign(it, palette[i % palette.length], { pct: total ? Math.round((it.count / total) * 100) + '%' : '0%' }));
    // squarified treemap in a 200 x 100 box, returned as percentages
    const W = 200, H = 100;
    const vis = items.filter((it) => it.count > 0);
    const scale = total ? (W * H) / total : 0;
    let rest = vis.map((it) => ({ it: it, area: it.count * scale }));
    let x = 0, y = 0, w = W, h = H;
    const rects = [];
    const worst = (row, s) => {
      const sum = row.reduce((a, r) => a + r.area, 0);
      const mx = Math.max.apply(null, row.map((r) => r.area)), mn = Math.min.apply(null, row.map((r) => r.area));
      return Math.max((s * s * mx) / (sum * sum), (sum * sum) / (s * s * mn));
    };
    while (rest.length) {
      const s = Math.min(w, h);
      const row = [rest.shift()];
      while (rest.length && worst(row.concat([rest[0]]), s) <= worst(row, s)) row.push(rest.shift());
      const sum = row.reduce((a, r) => a + r.area, 0);
      if (w >= h) {
        const rw = sum / h; let cy = y;
        row.forEach((r) => { const rh = r.area / rw; rects.push({ it: r.it, x: x, y: cy, w: rw, h: rh }); cy += rh; });
        x += rw; w -= rw;
      } else {
        const rh = sum / w; let cx = x;
        row.forEach((r) => { const rw2 = r.area / rh; rects.push({ it: r.it, x: cx, y: y, w: rw2, h: rh }); cx += rw2; });
        y += rh; h -= rh;
      }
    }
    return {
      label: f.label,
      empty: total === 0,
      aria: f.label + ' 분포. ' + items.map((it) => it.name + ' ' + it.count + '명(' + it.pct + ')').join(', '),
      rects: rects.map((r) => ({
        left: (r.x / W * 100).toFixed(2) + '%', top: (r.y / H * 100).toFixed(2) + '%',
        width: (r.w / W * 100).toFixed(2) + '%', height: (r.h / H * 100).toFixed(2) + '%',
        bg: r.it.bg, fg: r.it.fg, name: r.it.name, count: r.it.count, pct: r.it.pct,
        title: r.it.name + ' ' + r.it.count + '명 (' + r.it.pct + ')',
        showText: r.w / W > 0.2 && r.h / H > 0.3
      })),
      legend: items.map((it) => ({ name: it.name, count: it.count, pct: it.pct, bg: it.bg }))
    };
  }

  // 필터 보기: 항목 정의의 보기 + 미선택. 하위 항목(기기 모델)은 상위 필터(사용 기기)에 맞춰 좁혀집니다.

      vals = [];
      keys.forEach((k) => (f.optionsBy[k] || []).forEach((o) => { if (vals.indexOf(o) === -1) vals.push(o); }));

  // ---- 엑셀(.xlsx) 만들기: 외부 라이브러리 없이 최소 구성의 통합문서를 만듭니다 ----
  crcTable() {

    const t = new Uint32Array(256);

      const common = [].concat(u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));

      chunks.push(local, name, data);
      central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), common, u16(0), u16(0), u16(0), u32(0), u32(offset))), name);
      offset += local.length + name.length + data.length;
    });
    const cdSize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));

    all.forEach((c) => { out.set(c, p); p += c.length; });

  makeXlsx(sheetName, table) {

    const widths = table[0].map((_, ci) => Math.min(60, Math.max.apply(null, table.map((r) => width(r[ci]))) + 2));

          transition: s.dragging || !s.slideAnimate ? 'none' : 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)',
          cursor: s.dragging ? 'grabbing' : 'grab',
          // 손가락·마우스로 끌어서 넘기기
          down: (e) => {
            if (e.button != null && e.button !== 0) return;
            this._drag = { x: e.clientX, id: e.pointerId, moved: false, touch: e.pointerType !== 'mouse' };
            this.setState({ dragging: true, dragX: 0, slideHover: true });
          },
          move: (e) => {
            const d = this._drag;
            if (!d) return;
            const dx = e.clientX - d.x;
            if (!d.moved && Math.abs(dx) > 6) {
              d.moved = true;
              try { e.currentTarget.setPointerCapture(d.id); } catch (err) {}
            }
            if (d.moved) this.setState({ dragX: dx });
          },
          up: (e) => {
            const d = this._drag;
            if (!d) return;
            this._drag = null;
            this._justDragged = d.moved;
            const dx = d.moved ? (e.clientX - d.x) : 0;
            let steps = Math.round(-dx / (W + G));
            if (steps === 0 && Math.abs(dx) > 40) steps = dx < 0 ? 1 : -1;
            this.setState({ dragging: false, dragX: 0, slideHover: d.touch ? false : this.state.slideHover });
            if (steps) this.goSlide(this.state.slidePos + steps);
            this.scheduleSlide();
          },
          clickCap: (e) => { if (this._justDragged) { this._justDragged = false; e.stopPropagation(); e.preventDefault(); } },
          hoverOn: () => this.setState({ slideHover: true }),
          hoverOff: () => this.setState({ slideHover: false }),
          slides: all.map((sl, i) => {
            const on = i === cur;
            const near = Math.abs(i - cur) === 1;
            const real = i % n;
            return {
              no: real + 1,
              title: sl.title,
              sub: sl.sub,
              image: sl.image,
              video: sl.video,
              poster: sl.image || '',
              hasVideo: !!sl.video,
              autoPlay: !s.slidePaused,
              hasSprite: sl.sprite != null && !sl.image && !sl.video,
              spritePos: sl.sprite != null ? ((sl.sprite % 5) * 25) + '% ' + (Math.floor(sl.sprite / 5) * 25) + '%' : '0 0',
              hasImage: !!sl.image && !sl.video,
              noImage: sl.sprite == null && !sl.image && !sl.video,
              aria: (real + 1) + ' / ' + n + ': ' + sl.title,
              hidden: on ? 'false' : 'true',
              opacity: on ? 1 : (near ? 0.45 : 0.25),
              scale: on ? 1 : 0.86,
              shadow: on ? '0 28px 56px rgba(0, 0, 0, 0.5)' : 'none',
              cursor: on ? 'default' : 'pointer',
              go: () => { if (this._justDragged) { this._justDragged = false; return; } if (i !== this.state.slidePos) { this.goSlide(i); this.scheduleSlide(); } }
            };
          })
        };
      })(),
      gallery: (() => {
        const all = this.heroSlides();
        const more = this.moreSlides();
        const pos = (k) => ((k % 5) * 25) + '% ' + (Math.floor(k / 5) * 25) + '%';
        const open = this.teaserIds();
        const idx = s.galleryIdx;
        const viewing = s.galleryOpen && open.indexOf(idx) !== -1;
        const cur = viewing ? all[idx] : {};
        const step = (d) => { const p = open.indexOf(idx); const q = ((p + d) % open.length + open.length) % open.length; this.setState({ galleryIdx: open[q] }); };
        const peekIdx = [5, 20, 19].filter((k) => k < all.length);
        const lockedCount = more.length - open.length;
        return {
          count: more.length,
          lockedCount: lockedCount,
          teaser: '특가·쿠폰 · 행운룰렛 · 출석체크 · 친구초대 …',
          intro: open.length + '개 페이지는 지금 맛보기로 공개하고, 나머지 ' + lockedCount + '개는 베타 테스터에게 가장 먼저 공개돼요. 11.24부터 직접 써보고 의견으로 완성해 주세요.',
          peek: peekIdx.map((k, i) => ({ pos: pos(all[k].sprite), ml: i ? '-12px' : '0', rot: ['-8deg', '0deg', '8deg'][i] })),
          open: () => this.setGallery(true, -1),
          close: () => this.setGallery(false, -1),
          backdrop: () => this.setGallery(false, -1),
          stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
          applyExt: () => {
            this.setGallery(false, -1);
            try { window.open((this.props.applyUrl || 'https://naver.me/Ix0Mlh7W').trim(), '_blank', 'noopener'); } catch (e) {}
            return;
            setTimeout(() => { try { const el = document.getElementById('apply'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }, 50);
          },
          isOpen: !!s.galleryOpen,
          isList: s.galleryOpen && !viewing,
          isViewer: viewing,
          heading: viewing ? '맛보기 공개' : '아직 공개되지 않은 페이지',
          badge: viewing ? (open.indexOf(idx) + 1) + ' / ' + open.length : more.length + '개',
          toList: () => this.setState({ galleryIdx: -1 }),
          prev: () => step(-1),
          next: () => step(1),
          cur: { title: cur.title || '', sub: cur.sub || '', pos: pos(cur.sprite || 0) },
          groups: this.galleryGroups().map((g) => {
            const ids = g.ids.filter((k) => k < all.length);
            const sorted = ids.filter((k) => open.indexOf(k) !== -1).concat(ids.filter((k) => open.indexOf(k) === -1));
            const items = sorted.map((k) => {
              const un = open.indexOf(k) !== -1;
              return { title: all[k].title, sub: all[k].sub, pos: pos(all[k].sprite), unlocked: un, locked: !un, open: () => this.setState({ galleryIdx: k }) };
            });
            return { title: g.title, count: items.length + '개', items: items };
          })
        };
      })(),
      toTop: () => { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); } },
      topOpacity: s.showTop ? 1 : 0,
      topShift: s.showTop ? '0' : '12px',
      topPointer: s.showTop ? 'auto' : 'none',
      topTab: s.showTop ? '0' : '-1',
      live: (() => {
        const list = this.liveList();
        const a = list[s.liveIdx] || list[0];
        const name = a ? this.maskName(a.values.name) : '';
        return {
          name: name,
          initial: name ? name[0] : '',
          isNew: !!(a && s.liveNewId && a.id === s.liveNewId),
          opacity: s.liveShow && a ? 1 : 0,
          shift: s.liveShow && a ? '0' : '16px'
        };
      })(),
      // 모든 신청 버튼이 연결되는 외부 신청 폼(네이버 폼). Tweaks의 applyUrl에서 바꿀 수 있어요.
      apply: { href: (this.props.applyUrl || 'https://naver.me/Ix0Mlh7W').trim() },
      policy: {
        privacy: () => this.setState({ detailKey: 'consentPrivacy' }),
        terms: () => this.setState({ detailKey: 'consentTerms' })
      },
      // 타이머는 화면 표시용이에요. 0이 되면 마감일 표시로 바뀌고, 신청 버튼은 그대로 열려 있어요(접수 연장 가능).
      timerRunning: !closed && left > 0,
      timerDone: closed,
      share: () => this.sharePage(),
      hasToast: !!s.toast,
      toast: s.toast,
      showApplyCta: !s.submitted,
      tabs: this.tabDefs().map((t) => {
        const on = s.activeTab === t.id;
        return {
          id: t.id, label: t.label,
          current: on ? 'true' : 'false',
          line: on ? '#FF4802' : 'transparent',
          color: on ? '#2B2523' : '#6B625E',
          weight: on ? 700 : 500,
          go: () => this.setState({ activeTab: t.id })
        };
      }),
      openMission: () => this.setState({ missionOpen: true }),
      closeMission: () => this.setState({ missionOpen: false }),
      submitDisabled: closed || !consentsOk,
      needConsent: !closed && !consentsOk,
      submitBg: !closed && consentsOk ? '#FF4802' : '#EDE5E1',
      submitColor: !closed && consentsOk ? '#FFFFFF' : '#7A706B',
      submitCursor: !closed && consentsOk ? 'pointer' : 'not-allowed',
      submitLabel: closed ? '신청 마감' : '신청하기',
      open: !closed,
      closed: closed,
      timer: (() => {
        const sec = Math.floor(left / 1000);
        const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
        const pad = (n) => String(n).padStart(2, '0');
        const urgent = sec < 86400;
        return {
          aria: '신청 마감까지 ' + d + '일 ' + h + '시간 ' + m + '분 남았어요.',
          parts: [
            { value: d, unit: '일', color: '#FFFFFF' },
            { value: pad(h), unit: '시간', color: urgent ? '#FF6B33' : '#FFFFFF' },
            { value: pad(m), unit: '분', color: urgent ? '#FF6B33' : '#FFFFFF' },
            { value: pad(x), unit: '초', color: urgent ? '#FF6B33' : '#FFFFFF' }
          ]
        };
      })(),
      submit: () => {
        if (this.isClosed()) return;
        const errors = this.validate(this.state.form);
        if (Object.keys(errors).length) { this.setState({ errors: errors }); return; }
        const entry = { id: 'a' + Date.now(), createdAt: this.stamp(), values: Object.assign({}, this.state.form) };
        this.setState({ applicants: this.state.applicants.concat([entry]), submitted: true, form: this.emptyForm(), errors: {}, liveNewId: entry.id });
        setTimeout(() => this.liveCycle(0), 300);
      },
      reset: () => this.setState({ submitted: false }),
      goLogin: () => this.go('login'),
      goPage: () => this.go('page'),
      logout: () => this.go('login'),
      pw: s.pw,
      pwError: s.pwError,
      pwBorder: s.pwError ? '#C23A00' : '#CFC5C0',
      onPw: (e) => this.setState({ pw: e.target.value, pwError: false }),
      onPwKey: (e) => { if (e.key === 'Enter') { if (this.state.pw === password) this.go('admin'); else this.setState({ pwError: true }); } },
      login: () => { if (this.state.pw === password) this.go('admin'); else this.setState({ pwError: true }); },
      totalCount: s.applicants.length,
      treemaps: treemaps,
      ts: ts,
      columns: [{ label: 'No.', plain: true }].concat(defs.map((f) => {
        const n = (s.filters[f.key] || []).length;
        const open = s.openFilter === f.key;
        return {
          label: f.label, filterable: !!f.filter, plain: !f.filter,
          active: n > 0, activeCount: n, expanded: open ? 'true' : 'false',
          bg: open ? '#FFFFFF' : (n ? '#FFFFFF' : 'transparent'),
          border: open || n ? '#FF4802' : '#E5DAD4',
          toggle: () => this.setState({ openFilter: open ? null : f.key })
        };
      })).concat([{ label: '신청일시', plain: true }]),
      panel: panel,
      chips: chips,
      dateFrom: s.dateFrom,
      dateTo: s.dateTo,
      dateError: dateError,
      onDateFrom: (e) => this.setState({ dateFrom: e.target.value, exportMsg: '' }),
      onDateTo: (e) => this.setState({ dateTo: e.target.value, exportMsg: '' }),
      resetAll: () => this.setState({ query: '', dateFrom: '', dateTo: '', filters: {}, openFilter: null, exportMsg: '' }),
      resultCount: rows.length,
      exportDisabled: rows.length === 0 || s.exporting,
      exportBg: rows.length === 0 || s.exporting ? '#9C928D' : '#2B2523',
      exportXlsx: () => this.exportRows(exportTable, rows.length),
      hasExportMsg: !!s.exportMsg,
      exportMsg: s.exportMsg,
      rows: rows,
      noRows: rows.length === 0,
      emptyText: s.applicants.length ? '조건에 맞는 신청자가 없어요.' : '아직 신청자가 없어요.',
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value, exportMsg: '' })
    };
  }
}
